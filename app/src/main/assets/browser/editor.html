function boot(){mapPicking=false;const root=$('#app');root.innerHTML=`<header class="top"><div><div class="brand"><b>Bodenwelle</b> · Am Computer</div><p class="small">Deine Fundstellen prüfen und beschreiben</p></div><div class="toolbar"><button id="open">Datei öffnen</button><button id="undo">↶ Rückgängig</button><button id="redo">↷ Wiederholen</button><button id="save" class="primary">Bearbeitete Datei speichern</button></div></header><div class="notice"><span id="summary"></span><span id="save-state" role="status"></span></div><main class="layout"><aside id="list" class="panel" aria-label="Fundstellen"></aside><section id="map" aria-label="Karte der Fundstellen"><div id="basemap"></div><canvas id="measurement-layer"></canvas><nav class="map-controls" aria-label="Kartensteuerung"><button id="zoom-in" aria-label="Karte vergrößern">＋</button><button id="zoom-out" aria-label="Karte verkleinern">−</button><button id="fit">Alle Stellen</button><button id="locate">Auswahl zeigen</button><button id="map-bundle-toggle" aria-pressed="false">Auf Karte bündeln</button></nav><div class="map-options"><label><input id="network" type="checkbox" checked> Straßenkarte</label><label><input id="route" type="checkbox" checked> Fahrtspur</label></div><div id="map-bundle-bar" class="map-bundle-bar hidden"><span id="map-selection-count"></span><button id="map-merge" class="primary">Auswahl bündeln</button><button id="map-clear">Leeren</button><button id="map-stop">Beenden</button></div><div id="map-state" class="map-state" role="status" aria-live="polite"></div><div class="map-caption"><a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div></section><aside id="inspector" class="panel" aria-label="Beschreibung bearbeiten"></aside></main>`;

function drawMap(){if(!M||!$('#map'))return;const map=$('#map'),w=map.clientWidth,h=map.clientHeight;if(!w||!h)return;const z=Math.floor(M.zoom),scale=2**(M.zoom-z),center=project(M.lat,M.lon,z),left=center.x-w/2/scale,top=center.y-h/2/scale,network=$('#network').checked;

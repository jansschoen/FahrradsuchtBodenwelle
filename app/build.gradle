plugins {
    id 'com.android.application'
}

android {
    namespace 'de.fahrradsucht.bodenwelle'
    compileSdk 35

    defaultConfig {
        applicationId 'de.fahrradsucht.bodenwelle'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'javax.net.ssl.trustStore', 'user.home'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
